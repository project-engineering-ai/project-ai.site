name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Минимальные права: чтение репозитория + публикация Pages через OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps (Tailwind)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Версия фиксирована: тема hugoplate объявляет совместимость 0.158–0.165
          hugo-version: "0.158.0"
          extended: true

      - name: Generate theme CSS
        run: node scripts/themeGenerator.js

      - name: Build
        run: hugo --gc --minify

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
